name: Publish card data

on:
    workflow_dispatch:
    schedule:
        - cron: "0 10 * * 1,4"

permissions:
    contents: write

concurrency:
    group: publish-card-data
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: main

            - name: Set up Rust
              run: |
                  rustup toolchain install stable --profile minimal
                  rustup default stable

            - name: Install just
              run: cargo install just --locked

            - name: Generate card data
              run: |
                  set -euo pipefail
                  trap 'if [[ -f output/report.md ]]; then cat output/report.md >> "$GITHUB_STEP_SUMMARY"; fi' EXIT
                  just generate --refresh-resources --check-images

            - name: Publish changed card data
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  jq -e --arg source "https://github.com/$GITHUB_REPOSITORY/releases/latest" \
                      '.latest_release == $source' output/comparison.json > /dev/null
                  if jq -e '.previous_release != null and .has_changes == false' output/comparison.json > /dev/null; then
                      echo 'Card data is unchanged; no release created.'
                      exit 0
                  fi

                  next_patch="$(
                      gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' |
                          jq -Rs '[split("\n")[] | select(test("^0\\.0\\.[0-9]+$")) | split(".")[2] | tonumber] | (max // 0) + 1'
                  )"
                  tag="0.0.$next_patch"
                  assets=(output/ot.json output/rd.json)
                  for file in output/ot.diff output/rd.diff; do
                      if [[ -s "$file" ]]; then
                          assets+=("$file")
                      fi
                  done
                  gh release create "$tag" "${assets[@]}" \
                      --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" \
                      --title "$tag" --notes-file output/report.md --latest
