name: Publish card data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 1,5"

permissions:
  contents: write

concurrency:
  group: publish-card-data
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Generate card data
        run: cargo run --locked --release -- --refresh-resources --check-images

      - name: Publish changed card data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_error="$RUNNER_TEMP/latest-release-error"
          if latest_tag="$(
            gh release view \
              --repo "$GITHUB_REPOSITORY" \
              --json tagName \
              --jq .tagName \
              2>"$release_error"
          )"; then
            previous_dir="$RUNNER_TEMP/previous-release"
            mkdir -p "$previous_dir"
            gh release download "$latest_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$previous_dir" \
              --pattern "ot.json" \
              --pattern "rd.json"

            unchanged=true
            for dataset in ot rd; do
              test -s "$previous_dir/$dataset.json"
              jq --compact-output --sort-keys . "output/$dataset.json" \
                > "$previous_dir/current-$dataset.json"
              jq --compact-output --sort-keys . "$previous_dir/$dataset.json" \
                > "$previous_dir/released-$dataset.json"
              if ! cmp -s \
                "$previous_dir/current-$dataset.json" \
                "$previous_dir/released-$dataset.json"; then
                unchanged=false
              fi
            done

            if [[ "$unchanged" == true ]]; then
              echo "Generated card data matches release $latest_tag; publication skipped." \
                >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          else
            release_count="$(
              gh release list \
                --repo "$GITHUB_REPOSITORY" \
                --limit 1 \
                --exclude-drafts \
                --exclude-pre-releases \
                --json tagName \
                --jq length
            )"
            if [[ "$release_count" != "0" ]]; then
              cat "$release_error" >&2
              exit 1
            fi
          fi

          next_patch="$(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[].tag_name' |
              awk -F. '
                NF == 3 && $1 == "0" && $2 == "0" && $3 ~ /^[1-9][0-9]*$/ {
                  patch = $3 + 0
                  if (patch > max) max = patch
                }
                END { print max + 1 }
              '
          )"
          tag="0.0.$next_patch"

          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            tag --annotate "$tag" --message "chore(release): version bump to $tag"
          git push origin "refs/tags/$tag"

          gh release create "$tag" \
            output/ot.json \
            output/rd.json \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$tag" \
            --notes-file output/report.md \
            --latest
